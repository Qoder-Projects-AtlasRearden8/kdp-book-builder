[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdp-book-builder"
version = "0.1.0"
description = "Turn a folder of Markdown chapters into KDP-ready print PDF, EPUB, and cover-wrap files."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Asdale Dynamics, LLC" },
]
license = { file = "LICENSE" }
keywords = ["kdp", "self-publishing", "markdown", "epub", "pdf", "books"]
urls = { Homepage = "https://dylanasdale.github.io" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Publishing",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "reportlab>=4.0,<6",
  "markdown-it-py>=3.0,<5",
  "PyYAML>=6.0,<7",
  "Pillow>=10.0,<14",
  "pypdf>=5.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
]
validation = [
  "epubcheck>=5.0",
]

[project.scripts]
kdp-book-builder = "kdp_book_builder.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kdp_book_builder = [
  "assets/fonts/*.ttf",
  "assets/fonts/LICENSE.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
